name: Keep the apps awake

# Streamlit Cloud sleeps an app after ~12 hours without a visitor; the next real user then
# waits for it to wake. This visits every app listed in sync/keep_alive_apps.txt in a headless
# browser every 4 hours (see sync/keep_alive.py), waking any that already went to sleep. An app
# that still doesn't render after three tries fails the run: worth a look.
on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python sync/keep_alive.py
